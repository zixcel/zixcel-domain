[package]
name = "zixcel-domain-cli"
version = "0.4.1"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/zixcel/zixcel-domain"
description = "Scoped Domain administration through the Zixcel native protocol"
publish = false
[[bin]]
name = "zix-domain"
path = "src/main.rs"
[dependencies]
zixcel-domain = { path = "../.." }
zix-native-provider = { git = "https://github.com/zixcel/cli", rev = "660af91c8b282398369d6bb77d0ece545b49cf34" }
zix-cli = { git = "https://github.com/zixcel/cli", rev = "660af91c8b282398369d6bb77d0ece545b49cf34" }
serde_json = "1"
zixcel-cloudflare-observer = { git = "https://github.com/zixcel/zixcel-cloudflare", rev = "2d931b06c7638a520f008526bb66c71cb438d8ba" }
serde = { version = "1", features = ["derive"] }
zix-operation-contracts = { git = "https://github.com/zixcel/cli", rev = "660af91c8b282398369d6bb77d0ece545b49cf34" }
tokio = { version = "1", features = ["rt", "time", "io-util", "signal"] }
[dev-dependencies]
sha2 = "0.11"
[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
all = "warn"
