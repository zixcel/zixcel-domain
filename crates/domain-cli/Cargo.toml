[package]
name = "zixcel-domain-cli"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/zixcel/zixcel-domain"
description = "Bounded zix protocol adapter over ValueDomain inventory"
publish = false
[[bin]]
name = "zix-domain"
path = "src/main.rs"
[dependencies]
zixcel-domain = { path = "../.." }
zix-native-provider = { git = "https://github.com/zixcel/cli", rev = "c2ee2e9670efe81473bf7067a8efa1944589619e" }
zix-cli = { git = "https://github.com/zixcel/cli", rev = "c2ee2e9670efe81473bf7067a8efa1944589619e" }
serde_json = "1"
zixcel-cloudflare-observer = { git = "https://github.com/zixcel/zixcel-cloudflare", rev = "2d931b06c7638a520f008526bb66c71cb438d8ba" }
serde = { version = "1", features = ["derive"] }
[dev-dependencies]
sha2 = "0.11"
[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
all = "warn"
