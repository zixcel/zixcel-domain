name: Source verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: '1.97.1'
          components: rustfmt, clippy
      - run: python3 .github/scripts/test_source_admission.py
      - run: cargo fmt --all --check
      - name: Audit locked dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked --no-default-features
          cargo audit --deny warnings
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo package --locked --allow-dirty
