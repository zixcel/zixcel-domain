[package]
name = "zixcel-domain"
version = "0.4.1"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
description = "Registrar and DNS inventory for local administrator tools"
repository = "https://github.com/zixcel/zixcel-domain"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
idna = "1"
sha2 = "0.11.0"
hickory-proto = { version = "0.26.3", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"
